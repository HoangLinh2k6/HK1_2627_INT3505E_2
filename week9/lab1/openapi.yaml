openapi: 3.0.3
info:
  title: User API
  version: 2.0.0
servers:
  - url: /api
tags:
  - name: Users
paths:
  /v1/users/{uid}:
    get:
      tags: [Users]
      deprecated: true
      summary: Get a user using the legacy API
      parameters:
        - name: uid
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: User found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/V1User"
        "404":
          description: User not found
  /v2/users:
    post:
      tags: [Users]
      summary: Create a user
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateUser"
      responses:
        "201":
          description: User created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/V2User"
        "400":
          description: Invalid request body
  /v2/users/{uid}:
    get:
      tags: [Users]
      summary: Get a user
      parameters:
        - name: uid
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: User found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/V2User"
        "404":
          description: User not found
components:
  schemas:
    CreateUser:
      type: object
      required: [first_name, last_name, email]
      properties:
        first_name:
          type: string
        last_name:
          type: string
        email:
          type: string
          format: email
    V1User:
      type: object
      properties:
        id:
          type: integer
        full_name:
          type: string
        email:
          type: string
          format: email
    V2User:
      type: object
      properties:
        id:
          type: integer
        first_name:
          type: string
        last_name:
          type: string
        email:
          type: string
          format: email
